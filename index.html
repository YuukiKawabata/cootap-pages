<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cootap — 育児の記録を、もっと身近に</title>
    <meta name="description" content="Cootap のサポートとプライバシー情報">
    <style>
      :root { color-scheme: light; --ink: #182337; --sub: #56657a; --accent: #f27b6b; --bg: #fff9f5; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
      main { max-width: 720px; padding: 72px 24px; margin: auto; }
      .mark { font-size: 48px; }
      h1 { margin: 12px 0 8px; font-size: clamp(34px, 8vw, 54px); letter-spacing: -.04em; }
      p { color: var(--sub); }
      nav { display: grid; gap: 12px; margin-top: 36px; }
      a { display: block; border: 1px solid #eddcd4; border-radius: 16px; padding: 17px 20px; background: #fff; color: var(--ink); text-decoration: none; font-weight: 650; }
      a:hover { border-color: var(--accent); }
      footer { margin-top: 56px; color: var(--sub); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">🐣</div>
      <h1>Cootap</h1>
      <p>毎日の育児記録を、家族といっしょにやさしく残すアプリです。</p>
      <nav>
        <a href="support.html">サポート / Support</a>
        <a href="privacy.html">プライバシーポリシー / Privacy Policy</a>
      </nav>
      <footer>© 2026 Cootap</footer>
    </main>
  </body>
</html>
